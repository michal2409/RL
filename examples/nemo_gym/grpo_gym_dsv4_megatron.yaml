# DeepSeek-V4-Flash-Base GRPO on the nemo_gym SWE (SWE-bench/OpenHands) dataset via the
# MEGATRON-BRIDGE path (not automodel/dtensor). Reuses the validated 24-node non-colocated
# megatron recipe (TP1/PP8/EP8, FP8 vLLM refit) and swaps the math dataset for nemo_gym SWE.
#
# Run with examples/nemo_gym/run_grpo_nemo_gym.py (registers the SWE env + Gym services).
# run_grpo_nemo_gym.py forces generation.vllm_cfg.expose_http_server=True + async_engine=True,
# so the SWE agent can reach the (non-colocated) vLLM HTTP endpoints.
#
# Phase 1 (plumbing validation): allow_empty_rollouts=true so a SWE rollout that can't run its
# SIF container (apptainer) just yields a reward=0 empty turn instead of aborting the step —
# this lets us validate megatron training + vLLM refit end-to-end before the SIF runtime is wired.
defaults: ../configs/grpo_dsv4_base_bf16_4k_megatron_24n.yaml

sif_dir: "/lustre/fsw/portfolios/coreai/users/lukaszp/data/sif"

grpo:
  num_prompts_per_step: 16
  num_generations_per_prompt: 4
  max_num_epochs: 1
  max_num_steps: 2
  val_period: 100000
  val_at_start: false
  val_at_end: false
  max_val_samples: null
  val_batch_size: null

loss_fn:
  reference_policy_kl_penalty: 0.0
  use_importance_sampling_correction: true
  truncated_importance_sampling_ratio: 2
  ratio_clip_min: 0.2
  ratio_clip_max: 0.28
  ratio_clip_c: 10
  sequence_level_importance_ratios: false
  token_level_loss: true

checkpointing:
  enabled: false

policy:
  # SWE prompts are long. 65536 fit all rollouts non-empty on the tiny smoke; the
  # non-colocated 24n has the memory headroom the colocated tiny lacked. Raise toward
  # 131072 with context parallelism (CP) if needed.
  max_total_sequence_length: 32768
  megatron_cfg:
    # NOTE: Context parallelism is NOT viable here — MCore requires sequence_packing for
    # CP (setup.py:393), but DSv4 CSA/DSA hard-assert packed_seq_params is None
    # (csa.py:528, dsa.py:997). CP-without-packing gives no sharding benefit (the indexer
    # still sees the full sequence). The DSA O(seq^2) index_scores at long seqlen must
    # instead be fixed in the indexer itself (chunk the query in _compute_index_scores).
    # The cross-cluster model_update_group was OOMing during NCCL channel
    # setup (root-caused via NCCL_DEBUG: "Cuda failure 2 out of memory" allocating 8
    # P2P/CUMEM+RDMA channels on top of the loaded model). The refit is a once-per-step
    # broadcast and doesn't need 8 channels — cap channels + shrink the per-channel buffer.
    env_vars:
      NCCL_MAX_NCHANNELS: "2"
      NCCL_BUFFSIZE: "2097152"
  generation:
    max_new_tokens: 2048
    vllm_cfg:
      # nemo_gym agent sends TEXT to the vLLM HTTP server -> vLLM must tokenize.
      # Override the base RL default (skip_tokenizer_init=true, token-id refit path),
      # else the OpenAI chat server's tokenizer is None (serving.py:248 assert).
      skip_tokenizer_init: false
      # SWE agent sends tools with tool_choice=auto; vLLM 0.21 render rejects (400)
      # unless enable_auto_tools + tool_parser are set (render/serving.py:219).
      http_server_serving_chat_kwargs:
        enable_auto_tools: true
        tool_parser: hermes

data:
  max_input_seq_length: null
  shuffle: false
  num_workers: 1
  # dataset_name is set explicitly here (not just in `default`) because the math base
  # config sets data.train/validation.dataset_name=DAPOMath17K, and the default-merge
  # is fill-missing only — so it would NOT be overridden otherwise.
  train:
    dataset_name: NemoGymDataset
    data_path: "/lustre/fsw/portfolios/coreai/users/lukaszp/data/swe/train.jsonl"
  validation:
    dataset_name: NemoGymDataset
    data_path: "/lustre/fsw/portfolios/coreai/users/lukaszp/data/swe/validation.jsonl"
  default:
    dataset_name: NemoGymDataset
    env_name: "nemo_gym"
    prompt_file: null
    system_prompt_file: null
    processor: "nemo_gym_data_processor"

env:
  should_use_nemo_gym: true
  should_log_nemo_gym_responses: true
  nemo_gym:
    skip_venv_if_present: true
    allow_empty_rollouts: true
    port_range_low: 15001
    port_range_high: 20000
    config_paths:
      - responses_api_models/vllm_model/configs/vllm_model_for_training.yaml
      - responses_api_agents/swe_agents/configs/swebench_openhands_training.yaml
    policy_model:
      responses_api_models:
        vllm_model:
          uses_reasoning_parser: false
          extra_body:
            chat_template_kwargs:
              enable_thinking: false
    swe_agents_train:
      responses_api_agents:
        swe_agents:
          agent_max_turns: 1
          concurrency: 16
          swebench_agent_timeout: 3600
          openhands_should_log: false
          base_results_dir: /logs/nemo_gym/swe_agents_train
          run_with_mixed_prompts: true
          dataset_path: ${data.train.data_path}
          container_formatter:
            - "${sif_dir}/swebench_sweb.eval.x86_64.{instance_id}.sif"
            - "${sif_dir}/swegym_sweb.eval.x86_64.{instance_id}.sif"
            - "${sif_dir}/r2egym_{instance_id}.sif"
            - "/lustre/fsw/portfolios/llmservice/users/igitman/images/swe-bench/swebench_sweb.eval.x86_64.{instance_id}.sif"
    swe_agents_val:
      responses_api_agents:
        swe_agents:
          agent_max_turns: ${env.nemo_gym.swe_agents_train.responses_api_agents.swe_agents.agent_max_turns}
          concurrency: 16
          swebench_agent_timeout: ${env.nemo_gym.swe_agents_train.responses_api_agents.swe_agents.swebench_agent_timeout}
          openhands_should_log: false
          base_results_dir: /logs/nemo_gym/swe_agents_val
          dataset_path: ${data.validation.data_path}
          container_formatter: ${env.nemo_gym.swe_agents_train.responses_api_agents.swe_agents.container_formatter}
    use_absolute_ip: true

logger:
  wandb_enabled: false
  tensorboard_enabled: false
  mlflow_enabled: false
  monitor_gpus: true
  num_val_samples_to_print: 0

cluster:
  gpus_per_node: 8
  num_nodes: 24
