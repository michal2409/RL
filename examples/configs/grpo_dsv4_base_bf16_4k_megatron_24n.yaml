# GRPO config for DeepSeek-V4-Flash-Base — full-scale, H100 80GB SXM,
# non-colocated layout (vLLM rollout separate from Megatron training).
#
# Cluster layout: 24 nodes × 8 H100 80GB GPUs = 192 GPUs
#   - 16 train nodes (128 GPUs): Megatron-Bridge, EP=8, PP=2, TP=1
#   - 8  inference nodes (64 GPUs): vLLM, TP=4 → 16 replicas
#
# Sizing rationale (for tuning to a different cluster):
#   - Full model is ~671B params (61 layers, 256 MoE experts/layer).
#   - GB300 (144 GB/GPU) needed 16 nodes (8 train EP=4 + 8 inf TP=4); see
#     grpo_dsv4_base_bf16_4k_megatron_8n_ep4.yaml.
#   - H100 80GB has ~55% of the GB300 memory budget. To compensate this
#     config doubles EP (4→8) and adds PP=2, which together fit non-expert
#     weights + activations + optimizer-CPU-offload comfortably under 80GB.
#   - Per-rank load (training): experts ~1.6GB, dense ~2GB, activations
#     gated by activation_checkpointing=true, optimizer fully CPU-offloaded.
#
# To scale node count:
#   * 32 nodes (16 train + 16 inf): same EP=8/PP=2 but more vLLM replicas
#     for throughput. Set generation.colocated.resources.num_nodes=16.
#   * 16 nodes (12 train + 4 inf): drop PP back to 1, keep EP=8 (12*8/8=12
#     EP groups). Tighter; expect more activation recompute pressure.
#   * 48 nodes: typically more inference replicas, train side stays as-is.
#   Always: cluster.num_nodes = train_nodes + colocated.resources.num_nodes.
#
# Depends on (same as the 8n_ep4 recipe):
#   - NeMo-RL: deepseek_v4 chat template + vLLM Base FP8 patches
#   - Megatron-Bridge: V4 converter (PR #3562 / current branch)
#
# Launcher requirements (Flash-Base specific):
#   1. Apply the vLLM Base FP8 monkey-patch on every node BEFORE launching:
#        bash tools/patch_vllm_dsv4_base_fp8_quick.sh
#   2. The env vars below are propagated to every Ray worker:
#        VLLM_DSV4_BASE_FP8=1      # routes experts via Fp8MoEMethod
#        NRL_SWIGLU_LIMIT=10       # clamp Base SwiGLU outputs
#   3. On hosts with CUDA driver < 13.0, also set:
#        NRL_DSV4_DISABLE_FUSED_MHC=1  (set in policy.megatron_cfg.env_vars below)
defaults: grpo_dsv4_base_bf16_4k_megatron_8n_ep4.yaml

grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 8
  max_num_steps: 1000
  val_period: 50
  max_val_samples: 960
  val_batch_size: 960
  reward_shaping:
    enabled: true
    overlong_buffer_length: 512
    max_response_length: 2048

checkpointing:
  enabled: true
  keep_top_k: 3
  save_period: 50
  model_save_format: null
  checkpoint_dir: results/grpo-dsv4-base-bf16-4k-megatron-24n

policy:
  train_global_batch_size: 512
  train_micro_batch_size: 1
  logprob_batch_size: 1

  megatron_cfg:
    # Doubled EP from the GB300 recipe (4 → 8) and added PP=2; together
    # this halves dense-weight residency per rank and spreads experts
    # twice as wide, recouping the ~45% memory headroom we lose moving
    # from GB300 144GB to H100 80GB.
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 2
    context_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 8
    sequence_parallel: true
    activation_checkpointing: true

    optimizer:
      lr: 2.0e-7
      min_lr: 2.0e-8
      weight_decay: 0.0
      use_precision_aware_optimizer: true

    scheduler:
      lr_warmup_iters: 20
      lr_warmup_init: 2.0e-8

    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:False"
      # Driver < 13.0: keep "1". Driver >= 13.0: set to "0" to use the
      # fused mHC proj-RMS kernel (cuTile).
      NRL_DSV4_DISABLE_FUSED_MHC: "1"

  generation:
    max_new_tokens: 2048
    vllm_cfg:
      tensor_parallel_size: 4
      gpu_memory_utilization: 0.85  # non-colocated → vLLM owns its GPUs
      precision: fp8
      kv_cache_dtype: fp8_ds_mla
      use_deep_gemm: true
      enforce_eager: true
      async_engine: true
      max_model_len: ${policy.max_total_sequence_length}
    vllm_kwargs:
      tokenizer_mode: deepseek_v4
    colocated:
      enabled: false
      resources:
        gpus_per_node: 8
        num_nodes: 8  # vLLM gets 8 of the 24 nodes (64 GPUs / TP=4 = 16 replicas)

logger:
  log_dir: results/grpo-dsv4-base-bf16-4k-megatron-24n
  tensorboard_enabled: true
  tensorboard: {}
  monitor_gpus: true

cluster:
  gpus_per_node: 8
  num_nodes: 24  # = train_nodes (16) + colocated.resources.num_nodes (8)
